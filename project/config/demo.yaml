random_seed: 42
luminosity_pb: 10000.0
tree_name: analysis
momentum_unit: GeV
entry_stop: 5000
chunk_size_events: 50000

# 必须先通过 ATLAS 官方 metadata 核对 channelNumber，再填写下面两项。
# prepare_demo.py 会检查 ROOT 文件中的 channelNumber 是否匹配。
samples:
  higgs:
    path: data/raw/higgs.root
    channel_numbers: [345060]
    label: 1
  zz:
    path: data/raw/zz.root
    channel_numbers: [700600]
    label: 0
  data:
    path: data/raw/data16_periodA.root
    period: data16_periodA

selection:
  require_exactly_four_leptons: true
  allowed_lepton_types: [11, 13]
  lepton_pt_thresholds_gev: [20.0, 15.0, 10.0, 7.0]
  electron_max_abs_eta: 2.47
  muon_max_abs_eta: 2.7
  require_zero_charge: true
  min_all_sfos_mass_gev: 5.0
  z1_mass_window_gev: [50.0, 106.0]
  z2_mass:
    min_mode: fixed
    fixed_min_gev: 12.0
    max_gev: 115.0
    sliding:
      low_m4l_gev: 140.0
      high_m4l_gev: 190.0
      low_min_gev: 12.0
      high_min_gev: 50.0
  m4l_window_gev: [105.0, 160.0]

training:
  n_estimators: 300
  max_depth: 3
  learning_rate: 0.05
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 2.0
