schema_version: "1.0"
feature_profile: base14

# Profile 内的 feature 默认全部开启；这里只需要列出需要覆盖的开关。
features: {}

training:
  n_estimators: 1000
  early_stopping_rounds: 50
  random_seed: 42
  n_jobs: 1
  tree_method: hist
  folds: 5

  # 列表长度全部为 1 时是单组参数；包含多个值时生成笛卡尔积候选。
  learning_rate: [0.05]
  max_depth: [3]
  min_child_weight: [5]
  subsample: [0.8]
  colsample_bytree: [0.8]
  reg_alpha: [0.1]
  reg_lambda: [2.0]

working_points:
  loose: 0.50
  medium: 0.20
  tight: 0.10
