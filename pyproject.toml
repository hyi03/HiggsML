[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higgsml-h4l"
version = "0.3.0"
description = "MC-only H4l representation, calibration, and inference research workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "awkward==2.12.0",
  "matplotlib==3.11.1",
  "mplhep==1.3.2",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "torch==2.7.1",
  "tqdm==4.70.0",
  "uproot==5.7.5",
  "vector==1.8.1",
]

[project.optional-dependencies]
parallel = ["cloudpickle==3.1.2", "threadpoolctl==3.6.0"]

[project.scripts]
higgsml = "higgsml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["higgsml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
