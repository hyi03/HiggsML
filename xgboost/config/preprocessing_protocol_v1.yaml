schema_version: "1.0"
role: mc_preprocessing
samples:
  higgs:
    channel_numbers: [345060]
    label: 1
    input_profile: release22
    tree_name: analysis
    momentum_unit: GeV
  zz:
    channel_numbers: [363490]
    label: 0
    input_profile: open_data_2020
    tree_name: mini
    momentum_unit: MeV
    normalization:
      source: official_metadata
      xsec_pb: 1.2564
      k_factor: 1.0
      filter_efficiency: 1.0
      sum_of_weights: 7538705.808
selection:
  require_exactly_four_leptons: true
  allowed_lepton_types: [11, 13]
  lepton_pt_thresholds_gev: [20.0, 15.0, 10.0, 7.0]
  electron_max_abs_eta: 2.47
  muon_max_abs_eta: 2.7
  require_zero_charge: true
  min_all_sfos_mass_gev: 5.0
  z1_mass_window_gev: [50.0, 106.0]
  z2_mass:
    min_mode: fixed
    fixed_min_gev: 12.0
    max_gev: 115.0
    sliding:
      low_m4l_gev: 140.0
      high_m4l_gev: 190.0
      low_min_gev: 12.0
      high_min_gev: 50.0
  m4l_window_gev: [105.0, 160.0]
  lepton_quality:
    enabled: true
    require_event_trigger: true
    require_trigger_match: true
    require_tight_id: true
    track_isolation_max: 0.3
    calo_isolation_max: 0.3
    electron_d0sig_max: 5.0
    muon_d0sig_max: 3.0
    z0_sintheta_max_mm: 0.5
weighting:
  physical_weight: signed_mc_normalization
  training_weight: per_class_normalized_absolute_physical_weight
identity:
  fields: [channelNumber, eventNumber]
  integer_only: true
features:
  base14:
    - lep1_pt
    - lep2_pt
    - lep3_pt
    - lep4_pt
    - lep1_eta
    - lep2_eta
    - lep3_eta
    - lep4_eta
    - mZ1
    - mZ2
    - pt4l
    - deltaR_Z1
    - deltaR_Z2
    - deltaPhi_ZZ
  angular5:
    - cos_theta_star
    - cos_theta_1
    - cos_theta_2
    - phi_decay_planes
    - phi_production_plane
  model:
    - lep1_pt
    - lep2_pt
    - lep3_pt
    - lep4_pt
    - lep1_eta
    - lep2_eta
    - lep3_eta
    - lep4_eta
    - mZ1
    - mZ2
    - pt4l
    - deltaR_Z1
    - deltaR_Z2
    - deltaPhi_ZZ
    - cos_theta_star
    - cos_theta_1
    - cos_theta_2
    - phi_decay_planes
    - phi_production_plane
forbidden_features:
  - m4l
  - channelNumber
  - eventNumber
  - runNumber
  - physical_weight
  - train_weight
  - source_sample
  - source_entry
splitting:
  algorithm: blake2b_64_big_endian_modulo
  payload: "{channelNumber}:{eventNumber}"
  digest_size_bytes: 8
  modulo: 10
  train_buckets: [0, 1, 2, 3, 4, 5]
  validation_buckets: [6, 7]
  test_buckets: [8, 9]
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
inputs:
  require_regular_file: true
  reject_symlinks: true
  sha256_required: true
  allowed_suffixes: [.root]
